name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # @vscode/vsce 4 requires Node 22+.
          node-version: "24"

      # Tool versions are pinned so a release never picks up an unreviewed
      # publisher CLI.
      - name: Package extension
        run: npx --yes @vscode/vsce@4.0.0 package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Secrets can't be referenced directly in `if:` conditions, so record
      # here whether each token is set and gate the optional publish steps on
      # this step's outputs.
      - name: Check publish tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "vsce=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"
          echo "ovsx=${OVSX_PAT:+yes}" >> "$GITHUB_OUTPUT"

      # Optional: publish the packaged .vsix to the VS Code Marketplace.
      # Requires repo secret VSCE_PAT (Azure DevOps PAT with Marketplace -> Manage scope).
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && steps.tokens.outputs.vsce == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath *.vsix

      # Optional: publish the packaged .vsix to Open VSX (for VSCodium / Cursor).
      # Requires repo secret OVSX_PAT.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && steps.tokens.outputs.ovsx == 'yes'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish *.vsix -p "$OVSX_PAT"
